name: Update school notices

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-school-notices
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Crawl notices (incremental, 3 sections)
        run: node tools/crawler/crawl.mjs --pages=5 --max-new=80

      - name: Commit data when changed
        run: |
          if git diff --quiet -- web/data/school_data.js; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "campus-info-bot"
          git config user.email "campus-info-bot@users.noreply.github.com"
          git add web/data/school_data.js
          git commit -m "chore(data): auto-update notices $(date -u +'%Y-%m-%d %H:%M UTC')"
          # checkout 在 Actions 中是 detached HEAD，裸 git push 会因无 upstream 报
          # fatal: The current branch ... has no upstream branch.
          # 显式指定远端与分支，并按需重试（并发写入时可能有轻微竞态）。
          for i in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed to ${{ github.ref_name }}"
              exit 0
            fi
            echo "push failed (attempt $i), rebasing onto remote..."
            sleep 5
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
          done
          echo "::error::push to ${{ github.ref_name }} failed after 3 attempts"
          exit 1
