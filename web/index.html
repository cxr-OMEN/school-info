<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="themeColor" content="#f4f1ea" />
  <script>
    (function () {
      var root = document.documentElement;
      var theme = 'light';
      try {
        var saved = localStorage.getItem('campus-theme');
        theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      root.dataset.theme = theme;
      var meta = document.getElementById('themeColor');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#111318' : '#f4f1ea');
    })();
  </script>
  <title>校园信息港 · 通知 / 校历 / 竞赛一站看</title>
  <meta name="description" content="自动聚合学校官网的通知公告、校历与考试、竞赛比赛信息，每天更新，一眼看到该看的事。" />
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%231f3a5c"/><g fill="%23f5f2ec"><rect x="16" y="17" width="32" height="6" rx="3"/><rect x="16" y="29" width="24" height="5" rx="2.5"/><rect x="16" y="40" width="18" height="5" rx="2.5"/></g></svg>' />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <h1 class="sr-only">校园信息港 · 学校信息聚合</h1>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">校</span>
        <div class="brand__text">
          <span class="brand__name">校园信息港</span>
          <span class="brand__tag">通知 · 校历 · 竞赛，一站看全</span>
        </div>
      </div>

      <div class="search" role="search">
        <label class="sr-only" for="q">搜索标题或摘要</label>
        <svg class="search__icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.8" />
          <path d="M13.5 13.5 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <input id="q" class="search__input" type="search" placeholder="搜索通知、考试、竞赛…"
               autocomplete="off" spellcheck="false" enterkeyhint="search" />
        <button type="button" class="search__clear" id="qClear" aria-label="清空搜索" hidden>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m6 6 8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="切换到深色模式" title="切换深色模式">
        <svg class="icon-sun" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="3.6" stroke="currentColor" stroke-width="1.6" />
          <path d="M10 2.4v1.8M10 15.8v1.8M2.4 10h1.8M15.8 10h1.8M4.6 4.6l1.3 1.3M14.1 14.1l1.3 1.3M15.4 4.6l-1.3 1.3M5.9 14.1l-1.3 1.3"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M16.2 12.1A6.4 6.4 0 0 1 7.9 3.8a6.6 6.6 0 1 0 8.3 8.3Z"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <div class="wrap">
    <section class="brief" aria-label="数据速览">
      <div class="brief__date">
        <span class="brief__day" id="briefDay">--</span>
        <span class="brief__mon"><span id="briefMonth">--</span><span class="brief__week" id="briefWeek"></span></span>
      </div>
      <div class="brief__body">
        <p class="brief__eyebrow">DATA BRIEF · 数据速览</p>
        <p class="brief__line" id="briefLine">正在统计…</p>
        <p class="brief__sub">来源：学校官网 · 每小时自动采集</p>
      </div>
    </section>
  </div>

  <nav class="filterbar" aria-label="分类筛选">
    <div class="wrap filterbar__inner">
      <div class="tabs" id="tabs" role="tablist" aria-label="信息分类"></div>
      <p class="filterbar__count" id="totalCount" aria-hidden="true"></p>
    </div>
  </nav>

  <main class="wrap" id="main" tabindex="-1">
    <div class="list-head">
      <h2 class="list-title" id="listTitle">正在加载…</h2>
      <p class="list-hint" id="listHint" role="status" aria-live="polite"></p>
    </div>

    <div class="notice" id="notice" role="alert" hidden>
      <svg class="notice__icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6" />
        <path d="M10 6.2v4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="10" cy="13.8" r="1" fill="currentColor" />
      </svg>
      <p class="notice__text" id="noticeText"></p>
      <button type="button" class="notice__retry" id="retry">重试</button>
    </div>

    <div class="grid" id="list" role="list"></div>

    <section class="more" id="more" aria-labelledby="moreLabel" hidden>
      <button type="button" class="more__toggle" id="moreToggle" aria-expanded="false" aria-controls="moreList">
        <span class="more__label" id="moreLabel">更多通知</span>
        <span class="more__count" id="moreCount">0</span>
        <span class="more__note">接收对象待确认</span>
        <svg class="more__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="grid more__grid" id="moreList" role="list" hidden></div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer__status">
        <span class="footer__dot" aria-hidden="true"></span>
        <span id="footerStatus">正在获取最新数据…</span>
      </p>
      <p>数据每小时自动采集自学校官网，7 天内的新通知会标注 NEW。</p>
      <p>「更多通知」为暂未确认接收对象的内容；教师通知不在本页展示。</p>
      <p>本页面仅做信息聚合，内容、时间与要求请以学校官网原文为准。</p>
    </div>
  </footer>

  <button type="button" class="to-top" id="toTop" aria-label="回到顶部">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" id="mPanel">
      <div class="modal__grabber" aria-hidden="true"></div>
      <div class="modal__head">
        <span class="chip" id="mCat"></span>
        <span class="badge-new" id="mNew" hidden>NEW</span>
        <button type="button" class="icon-btn" id="mClose" aria-label="关闭详情">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m5.5 5.5 9 9M14.5 5.5l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <h2 class="modal__title" id="mTitle"></h2>
      <p class="modal__meta" id="mMeta"></p>
      <p class="modal__summary" id="mSummary"></p>
      <div class="modal__foot">
        <p class="modal__hint">信息采集自学校官网，请以原文为准</p>
        <a class="btn-primary" id="mLink" href="#" target="_blank" rel="noopener noreferrer">
          前往官网原文
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>
  </div>

  <script src="./data/school_data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
